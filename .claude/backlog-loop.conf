# Per-repo settings for backlog-loop.sh (shell syntax; sourced, not executed).

# The roadmap is Boswell's single source of truth for status, per CONTRIBUTING.md.
BACKLOG_SOURCE=docs/development/roadmap.md

# The same three commands CI enforces. Default features only — feature-gated code is
# not built or tested in CI, so it is not verified here either.
VERIFY_CMD="cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace"

CONTEXT_BUDGET=110000
MODEL=opus

# auto is the script default: it approves routine work and stops for what it judges
# risky. Left explicit here because it is the setting most worth reconsidering per repo.
PERMISSION_MODE=auto
