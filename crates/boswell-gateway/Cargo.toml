[package]
name = "boswell-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "boswell-gateway"
path = "src/main.rs"

[dependencies]
boswell-domain = { workspace = true }
boswell-sdk = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
sha2 = "0.10"
# OIDC verification (ADR-022): JWT checking, and fetching the provider's JWKS.
jsonwebtoken = "9.3"
reqwest = { version = "0.12", features = ["json"] }
# Attenuable tokens (ADR-022). PEM key parsing and the full regex engine are
# unused here and off. `datalog-macro` is not used either, but 6.0 does not
# compile without it — `ToAnyParam` is gated on the feature and imported
# unconditionally by the builder. Drop it when that is fixed upstream.
biscuit-auth = { version = "6.0", default-features = false, features = ["datalog-macro"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
