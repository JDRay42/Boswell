[package]
name = "boswell-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "boswell"
path = "src/main.rs"

[dependencies]
boswell-domain = { workspace = true }
boswell-sdk = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# CLI dependencies
clap = { version = "4.5", features = ["derive", "env"] }
rustyline = "14.0"
tabled = "0.16"
colored = "2.1"
dirs = "5.0"
toml = "0.8"

# The device-code grant (`boswell login`) talks HTTP to an identity provider.
# Same version and feature set as every other reqwest in the workspace, so no
# second TLS stack is pulled in.
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.10"

# `test-util` is not in tokio's `full`, and the device-grant polling tests need
# a paused clock: they assert on interval back-off and an expiry deadline, and
# without it they would sleep for real.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
