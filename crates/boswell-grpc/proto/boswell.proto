syntax = "proto3";

package boswell.v1;

// BosWell gRPC Service
// 
// Provides core operations for asserting, querying, learning, and forgetting claims.
// Implements ADR-012 (learn operation), ADR-008 (gatekeeper pattern).
service BosWellService {
    // Assert a single claim into the knowledge base
    rpc Assert(AssertRequest) returns (AssertResponse);
    
    // Query claims from the knowledge base
    rpc Query(QueryRequest) returns (QueryResponse);

    // Semantic search: find claims by vector similarity to a query string.
    rpc Search(SearchRequest) returns (SearchResponse);
    
    // Learn multiple claims in bulk (ADR-012)
    rpc Learn(LearnRequest) returns (LearnResponse);
    
    // Mark a claim for eviction/forgetting
    rpc Forget(ForgetRequest) returns (ForgetResponse);

    // Fetch a single claim by id
    rpc GetClaim(GetClaimRequest) returns (GetClaimResponse);

    // Fetch the relationships (provenance / contradiction graph) for a claim
    rpc GetRelationships(GetRelationshipsRequest) returns (GetRelationshipsResponse);

    // Extract claims from unstructured text via the server-side LLM Extractor
    rpc Extract(ExtractRequest) returns (ExtractResponse);

    // Health check for instance status
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ========== Common Types ==========

// Tier in the claim lifecycle
enum Tier {
    TIER_UNSPECIFIED = 0;
    TIER_EPHEMERAL = 1;
    TIER_TASK = 2;
    TIER_PROJECT = 3;
    TIER_PERMANENT = 4;
}

// Confidence interval [lower, upper] per ADR-003
message ConfidenceInterval {
    double lower = 1;  // Range: [0.0, 1.0]
    double upper = 2;  // Range: [0.0, 1.0]
}

// A claim - the fundamental unit of knowledge
message Claim {
    string id = 1;                        // ULID string
    string namespace = 2;                 // Organizational namespace (ADR-006)
    string subject = 3;                   // Subject entity
    string predicate = 4;                 // Relationship/predicate
    string object = 5;                    // Object entity
    ConfidenceInterval confidence = 6;    // Confidence interval
    Tier tier = 7;                       // Lifecycle tier
    string source_type = 8;               // Origin: assertion | extraction | inference | import
}

// Provenance entry tracking claim origin
message ProvenanceEntry {
    string source = 1;      // Source identifier (e.g., "user", "extractor", "llm:gpt-4")
    int64 timestamp = 2;    // Unix timestamp in milliseconds
    string metadata = 3;    // Optional JSON metadata
}

// Type of relationship between two claims (mirrors the domain RelationshipType).
enum RelationshipType {
    RELATIONSHIP_TYPE_UNSPECIFIED = 0;
    RELATIONSHIP_TYPE_SUPPORTS = 1;      // One claim supports another
    RELATIONSHIP_TYPE_CONTRADICTS = 2;   // One claim contradicts another
    RELATIONSHIP_TYPE_DERIVED_FROM = 3;  // One claim was derived from another
    RELATIONSHIP_TYPE_REFERENCES = 4;    // One claim references another
    RELATIONSHIP_TYPE_SUPERSEDES = 5;    // One claim supersedes another
}

// A pairwise relationship between two claims (per ADR-002).
message Relationship {
    string from_claim = 1;                     // ULID of the source claim
    string to_claim = 2;                       // ULID of the target claim
    RelationshipType relationship_type = 3;    // Kind of relationship
    double strength = 4;                        // Strength in [0.0, 1.0]
    int64 created_at = 5;                       // Unix timestamp (seconds)
}

// ========== Assert Operation ==========

message AssertRequest {
    string namespace = 1;
    string subject = 2;
    string predicate = 3;
    string object = 4;
    ConfidenceInterval confidence = 5;
    Tier tier = 6;                            // Optional tier targeting
    repeated ProvenanceEntry provenance = 7;  // Provenance chain
    string auth_token = 8;                    // Authentication token
}

message AssertResponse {
    string claim_id = 1;                      // ULID of created/existing claim
    bool is_duplicate = 2;                    // True if claim already existed
    string message = 3;                       // Optional status message
}

// ========== Query Operation ==========

enum QueryMode {
    QUERY_MODE_UNSPECIFIED = 0;
    QUERY_MODE_FAST = 1;        // Fast path: no confidence recomputation
    QUERY_MODE_DELIBERATE = 2;  // Deliberate: recompute confidence with support networks
}

message QueryFilter {
    optional string namespace = 1;
    optional string subject = 2;
    optional string predicate = 3;
    optional string object = 4;
    optional Tier tier = 5;
    optional double min_confidence = 6;  // Minimum confidence midpoint
    optional string source_type = 7;     // Origin filter: assertion | extraction | inference | import
}

message QueryRequest {
    QueryFilter filter = 1;
    QueryMode mode = 2;
    int32 limit = 3;                     // Maximum results (default: 100)
    string auth_token = 4;
}

message QueryResponse {
    repeated Claim claims = 1;
    int32 total_count = 2;               // Total matching claims (may exceed limit)
    string message = 3;
}

// ========== Search Operation (semantic / vector similarity) ==========

message SearchRequest {
    string query_text = 1;               // Natural-language query to embed and match
    optional string namespace = 2;       // Optional namespace prefix filter
    int32 limit = 3;                     // Maximum results (default: 10)
    double min_similarity = 4;           // Minimum cosine similarity [0.0, 1.0]
    string auth_token = 5;
}

message SearchResult {
    Claim claim = 1;
    double similarity = 2;               // Cosine similarity to the query [0.0, 1.0]
}

message SearchResponse {
    repeated SearchResult results = 1;   // Ordered by similarity descending
    int32 total_count = 2;
    string message = 3;
}

// ========== Learn Operation (ADR-012) ==========

message LearnRequest {
    repeated Claim claims = 1;           // Batch of claims to insert
    bool skip_duplicates = 2;            // Skip duplicate detection for performance
    string auth_token = 3;
}

message LearnResponse {
    int32 inserted_count = 1;
    int32 duplicate_count = 2;
    int32 error_count = 3;
    repeated string errors = 4;          // Error messages for failed insertions
    string message = 5;
}

// ========== Forget Operation ==========

message ForgetRequest {
    string claim_id = 1;                 // Claim to mark for eviction
    string reason = 2;                   // Optional eviction reason
    string auth_token = 3;
}

message ForgetResponse {
    bool success = 1;
    string message = 2;
}

// ========== GetClaim Operation ==========

message GetClaimRequest {
    string claim_id = 1;                 // ULID of the claim to fetch
    string auth_token = 2;
}

message GetClaimResponse {
    Claim claim = 1;                     // The claim, present only when found
    bool found = 2;                      // True if a claim with this id exists
}

// ========== GetRelationships Operation ==========

message GetRelationshipsRequest {
    string claim_id = 1;                 // ULID whose relationships to fetch
    string auth_token = 2;
}

message GetRelationshipsResponse {
    repeated Relationship relationships = 1;
}

// ========== Extract Operation (text -> claims via LLM) ==========

message ExtractRequest {
    string text = 1;                     // Unstructured text to extract claims from
    string namespace = 2;                // Target namespace for extracted claims
    string tier = 3;                     // Optional tier (default: "task")
    string source_id = 4;                // Optional source identifier for provenance
    string auth_token = 5;
}

message ExtractResponse {
    repeated Claim claims_created = 1;   // Newly created claims (source_type="extraction")
    int32 created_count = 2;
    int32 corroborated_count = 3;
    int32 failed_count = 4;
    repeated string failures = 5;        // Human-readable failure reasons
    string message = 6;
}

// ========== Health Check ==========

message HealthCheckRequest {
    // Empty for now
}

message HealthCheckResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_HEALTHY = 1;
        STATUS_DEGRADED = 2;
        STATUS_UNHEALTHY = 3;
    }
    
    Status status = 1;
    string version = 2;
    int64 uptime_seconds = 3;
    int64 claim_count = 4;
    string message = 5;
}
