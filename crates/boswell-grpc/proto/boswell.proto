syntax = "proto3";

package boswell.v1;

// BosWell gRPC Service
// 
// Provides core operations for asserting, querying, learning, and forgetting claims.
// Implements ADR-012 (learn operation), ADR-008 (gatekeeper pattern).
service BosWellService {
    // Assert a single claim into the knowledge base
    rpc Assert(AssertRequest) returns (AssertResponse);
    
    // Query claims from the knowledge base
    rpc Query(QueryRequest) returns (QueryResponse);

    // Semantic search: find claims by vector similarity to a query string.
    rpc Search(SearchRequest) returns (SearchResponse);
    
    // Learn multiple claims in bulk (ADR-012)
    rpc Learn(LearnRequest) returns (LearnResponse);
    
    // Mark a claim for eviction/forgetting
    rpc Forget(ForgetRequest) returns (ForgetResponse);

    // Fetch a single claim by id
    rpc GetClaim(GetClaimRequest) returns (GetClaimResponse);

    // Fetch the relationships (provenance / contradiction graph) for a claim
    rpc GetRelationships(GetRelationshipsRequest) returns (GetRelationshipsResponse);

    // Extract claims from unstructured text via the server-side LLM Extractor
    rpc Extract(ExtractRequest) returns (ExtractResponse);

    // ---- Procedural memory (design 15, phase 7a) ----

    // Retrieve procedures for a goal/intent. Each returned procedure carries an
    // execution receipt: retrieval obliges the caller to report.
    rpc QueryProcedures(QueryProceduresRequest) returns (QueryProceduresResponse);

    // Fetch one procedure by id, issuing an execution receipt for it.
    rpc GetProcedure(GetProcedureRequest) returns (GetProcedureResponse);

    // Report an execution outcome against a receipt (the reporting contract).
    rpc ReportOutcome(ReportOutcomeRequest) returns (ReportOutcomeResponse);

    // ---- Goal traversal (design 15, phase 7b) ----

    // Retrieve goals by namespace/intent — the entry hop into a decomposition.
    rpc QueryGoals(QueryGoalsRequest) returns (QueryGoalsResponse);

    // Fetch one goal by id.
    rpc GetGoal(GetGoalRequest) returns (GetGoalResponse);

    // Expand one goal into its ranked candidate surface (a single traversal hop).
    rpc Expand(ExpandRequest) returns (ExpandResponse);

    // Health check for instance status
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

    // Maintenance counters for scraping. The gateway renders these as Prometheus
    // exposition text; the instance itself serves no HTTP (ADR-021).
    rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
}

// ========== Common Types ==========

// Tier in the claim lifecycle
enum Tier {
    TIER_UNSPECIFIED = 0;
    TIER_EPHEMERAL = 1;
    TIER_TASK = 2;
    TIER_PROJECT = 3;
    TIER_PERMANENT = 4;
}

// Confidence interval [lower, upper] per ADR-003
message ConfidenceInterval {
    double lower = 1;  // Range: [0.0, 1.0]
    double upper = 2;  // Range: [0.0, 1.0]
}

// A claim - the fundamental unit of knowledge
message Claim {
    string id = 1;                        // ULID string
    string namespace = 2;                 // Organizational namespace (ADR-006)
    string subject = 3;                   // Subject entity
    string predicate = 4;                 // Relationship/predicate
    string object = 5;                    // Object entity
    ConfidenceInterval confidence = 6;    // Confidence interval
    Tier tier = 7;                       // Lifecycle tier
    string source_type = 8;               // Origin: assertion | extraction | inference | import
}

// Provenance entry tracking claim origin
message ProvenanceEntry {
    string source = 1;      // Source identifier (e.g., "user", "extractor", "llm:gpt-4")
    int64 timestamp = 2;    // Unix timestamp in milliseconds
    string metadata = 3;    // Optional JSON metadata
}

// Type of relationship between two claims (mirrors the domain RelationshipType).
enum RelationshipType {
    RELATIONSHIP_TYPE_UNSPECIFIED = 0;
    RELATIONSHIP_TYPE_SUPPORTS = 1;      // One claim supports another
    RELATIONSHIP_TYPE_CONTRADICTS = 2;   // One claim contradicts another
    RELATIONSHIP_TYPE_DERIVED_FROM = 3;  // One claim was derived from another
    RELATIONSHIP_TYPE_REFERENCES = 4;    // One claim references another
    RELATIONSHIP_TYPE_SUPERSEDES = 5;    // One claim supersedes another
}

// A pairwise relationship between two claims (per ADR-002).
message Relationship {
    string from_claim = 1;                     // ULID of the source claim
    string to_claim = 2;                       // ULID of the target claim
    RelationshipType relationship_type = 3;    // Kind of relationship
    double strength = 4;                        // Strength in [0.0, 1.0]
    int64 created_at = 5;                       // Unix timestamp (seconds)
}

// ========== Assert Operation ==========

message AssertRequest {
    string namespace = 1;
    string subject = 2;
    string predicate = 3;
    string object = 4;
    ConfidenceInterval confidence = 5;
    Tier tier = 6;                            // Optional tier targeting
    repeated ProvenanceEntry provenance = 7;  // Provenance chain
    reserved 8;  // was auth_token; deleted by ADR-021
}

message AssertResponse {
    string claim_id = 1;                      // ULID of created/existing claim
    bool is_duplicate = 2;                    // True if claim already existed
    string message = 3;                       // Optional status message
}

// ========== Query Operation ==========

enum QueryMode {
    QUERY_MODE_UNSPECIFIED = 0;
    QUERY_MODE_FAST = 1;        // Fast path: no confidence recomputation
    QUERY_MODE_DELIBERATE = 2;  // Deliberate: recompute confidence with support networks
}

message QueryFilter {
    optional string namespace = 1;
    optional string subject = 2;
    optional string predicate = 3;
    optional string object = 4;
    optional Tier tier = 5;
    optional double min_confidence = 6;  // Minimum confidence midpoint
    optional string source_type = 7;     // Origin filter: assertion | extraction | inference | import
}

message QueryRequest {
    QueryFilter filter = 1;
    QueryMode mode = 2;
    int32 limit = 3;                     // Maximum results (default: 100)
    reserved 4;  // was auth_token; deleted by ADR-021
}

message QueryResponse {
    repeated Claim claims = 1;
    int32 total_count = 2;               // Total matching claims (may exceed limit)
    string message = 3;
}

// ========== Search Operation (semantic / vector similarity) ==========

message SearchRequest {
    string query_text = 1;               // Natural-language query to embed and match
    optional string namespace = 2;       // Optional namespace prefix filter
    int32 limit = 3;                     // Maximum results (default: 10)
    double min_similarity = 4;           // Minimum cosine similarity [0.0, 1.0]
    reserved 5;  // was auth_token; deleted by ADR-021
}

message SearchResult {
    Claim claim = 1;
    double similarity = 2;               // Cosine similarity to the query [0.0, 1.0]
}

message SearchResponse {
    repeated SearchResult results = 1;   // Ordered by similarity descending
    int32 total_count = 2;
    string message = 3;
}

// ========== Learn Operation (ADR-012) ==========

message LearnRequest {
    repeated Claim claims = 1;           // Batch of claims to insert
    bool skip_duplicates = 2;            // Skip duplicate detection for performance
    reserved 3;  // was auth_token; deleted by ADR-021
}

message LearnResponse {
    int32 inserted_count = 1;
    int32 duplicate_count = 2;
    int32 error_count = 3;
    repeated string errors = 4;          // Error messages for failed insertions
    string message = 5;
}

// ========== Forget Operation ==========

message ForgetRequest {
    string claim_id = 1;                 // Claim to mark for eviction
    string reason = 2;                   // Optional eviction reason
    reserved 3;  // was auth_token; deleted by ADR-021
}

message ForgetResponse {
    bool success = 1;
    string message = 2;
}

// ========== GetClaim Operation ==========

message GetClaimRequest {
    string claim_id = 1;                 // ULID of the claim to fetch
    reserved 2;  // was auth_token; deleted by ADR-021
}

message GetClaimResponse {
    Claim claim = 1;                     // The claim, present only when found
    bool found = 2;                      // True if a claim with this id exists
}

// ========== GetRelationships Operation ==========

message GetRelationshipsRequest {
    string claim_id = 1;                 // ULID whose relationships to fetch
    reserved 2;  // was auth_token; deleted by ADR-021
}

message GetRelationshipsResponse {
    repeated Relationship relationships = 1;
}

// ========== Extract Operation (text -> claims via LLM) ==========

message ExtractRequest {
    string text = 1;                     // Unstructured text to extract claims from
    string namespace = 2;                // Target namespace for extracted claims
    string tier = 3;                     // Optional tier (default: "task")
    string source_id = 4;                // Optional source identifier for provenance
    reserved 5;  // was auth_token; deleted by ADR-021
}

message ExtractResponse {
    repeated Claim claims_created = 1;   // Newly created claims (source_type="extraction")
    int32 created_count = 2;
    int32 corroborated_count = 3;
    int32 failed_count = 4;
    repeated string failures = 5;        // Human-readable failure reasons
    string message = 6;
}


// ========== Procedural Memory (design 15) ==========

// A typed parameter in a procedure's signature.
message Parameter {
    string name = 1;
    string type_name = 2;
    optional string default = 3;
    optional string desc = 4;
}

// The (subject, predicate, object) pattern a precondition resolves against the
// claim store — the seam from procedural memory onto claims.
message ClaimMatch {
    string subject = 1;
    string predicate = 2;
    string object = 3;
}

// The resolvable check behind a precondition.
message PreconditionCheck {
    ClaimMatch match_pattern = 1;
    double min_confidence = 2;
    string expect = 3;                   // exists | absent
}

// A hard precondition gating whether a procedure may run at all.
message Precondition {
    string kind = 1;
    string description = 2;
    PreconditionCheck check = 3;
}

// A stored how-to. Mirrors boswell_domain::Procedure losslessly; the executable
// body is carried verbatim so the executor can run it, and the signature
// (parameters, preconditions) travels with it so the executor can decide
// whether it applies.
message Procedure {
    string id = 1;
    string namespace = 2;
    string name = 3;
    uint32 version = 4;
    optional string supersedes = 5;
    bool is_current = 6;
    string source = 7;                   // authored | learned | imported
    string goal = 8;                     // goal grouping key
    string intent = 9;
    repeated string tags = 10;
    repeated Parameter parameters = 11;
    repeated Precondition preconditions = 12;
    repeated string required_tools = 13;
    repeated string postconditions = 14;
    string usage_notes = 15;
    repeated string context_tags = 16;
    string body_format = 17;             // prose | dsl | code
    string content_type = 18;
    string body = 19;
    string tier = 20;
    uint64 use_count = 21;
    uint64 success_count = 22;
    uint64 failure_count = 23;
    uint64 unknown_count = 24;
    optional uint64 est_duration_sec = 25;
    optional uint64 last_used_at = 26;
    uint64 created_at = 27;
    uint64 updated_at = 28;
    optional uint64 stale_at = 29;
}

// The obligation-to-report receipt issued with every procedure.
message ExecutionReceipt {
    string receipt_id = 1;
    string procedure_id = 2;
    uint32 version = 3;
    string issued_to = 4;
    optional string task_id = 5;
    optional string session_id = 6;
    uint64 issued_at = 7;
    uint64 expires_at = 8;
    optional string report_to = 9;
}

// A procedure paired with the receipt issued for it.
message IssuedProcedure {
    Procedure procedure = 1;
    ExecutionReceipt receipt = 2;
}

message QueryProceduresRequest {
    optional string namespace = 1;
    optional string goal = 2;            // exact goal grouping key
    optional string intent_contains = 3; // case-insensitive substring of intent
    bool include_superseded = 4;
    optional uint32 limit = 5;
    string issued_to = 6;                // principal the receipts are issued to
    optional string task_id = 7;
    optional string session_id = 8;
    reserved 9;  // was auth_token; deleted by ADR-021
}

message QueryProceduresResponse {
    repeated IssuedProcedure procedures = 1;
    int32 count = 2;
    string message = 3;
}

message GetProcedureRequest {
    string id = 1;
    string issued_to = 2;
    optional string task_id = 3;
    optional string session_id = 4;
    // Namespace the caller is confined to. When set, a procedure outside it
    // reads as not-found *before* a receipt is issued, so a cross-namespace
    // probe cannot leave an unanswerable obligation against someone else's
    // procedure. Empty or "*" means unrestricted.
    optional string namespace_scope = 5;
    reserved 6;  // was auth_token; deleted by ADR-021
}

message GetProcedureResponse {
    bool found = 1;
    IssuedProcedure procedure = 2;
    string message = 3;
}

message ReportOutcomeRequest {
    string receipt_id = 1;
    string outcome = 2;                  // success | failure | abandoned
    // Failure attribution: preconditions_stale | step_failed | bad_result |
    // executor_error. Only meaningful when outcome = failure.
    optional string failure_mode = 3;
    optional string failed_step = 4;     // names the step when failure_mode = step_failed
    optional double executor_confidence = 5;
    optional double cost = 6;
    optional string notes = 7;
    reserved 8;  // was auth_token; deleted by ADR-021
}

message ReportOutcomeResponse {
    bool accepted = 1;                   // a pending receipt was found and closed
    bool already_final = 2;              // receipt was already reported/expired
    bool applied = 3;                    // the gatekeeper applied the report
    bool quarantined = 4;                // negative report held back (assurance too low)
    bool counted_as_success = 5;
    bool counted_as_failure = 6;
    bool attributed_to_executor = 7;
    bool flagged_precondition_stale = 8;
    string message = 9;
}

// ========== Goal Traversal (design 15 §3.2, §4.1) ==========

// A skinny navigational decomposition node. Mirrors boswell_domain::Goal
// losslessly. Children are not inlined — they live on edges and are surfaced by
// Expand, so a goal row stays cheap to walk.
message Goal {
    string id = 1;
    string namespace = 2;
    string name = 3;
    string intent = 4;
    repeated string definition_of_done = 5;
    string tier = 6;
    uint64 created_at = 7;
    uint64 updated_at = 8;
    optional uint64 stale_at = 9;
}

// A ranked entry in an expand surface. Carries the edge-local signals a hop
// needs to filter and rank *without* fetching the child row (§4.2), so the
// wire shape is lossless against boswell_domain::ExpandedCandidate.
message ExpandedCandidate {
    string child_kind = 1;               // goal | procedure
    string child_id = 2;
    string role = 3;                     // accomplish | decide
    repeated string context_tags = 4;
    string usage_notes = 5;
    double effectiveness = 6;
    uint32 context_match = 7;            // how many context_tags matched
}

// A claim consulted while resolving a candidate's preconditions, returned so
// the agent can see *why* a candidate surfaced (§4.1).
message FactorReading {
    string subject = 1;
    string predicate = 2;
    string object = 3;
    ConfidenceInterval confidence = 4;
}

// The traversal context an agent passes to Expand. The store uses these tags to
// rank; the *weighting* of one factor against another is never in the store.
message TraversalContext {
    repeated string context_tags = 1;
}

message QueryGoalsRequest {
    optional string namespace = 1;
    optional string intent_contains = 2; // case-insensitive substring of intent
    optional uint32 limit = 3;
    reserved 4;  // was auth_token; deleted by ADR-021
}

message QueryGoalsResponse {
    repeated Goal goals = 1;
    int32 count = 2;
    string message = 3;
}

message GetGoalRequest {
    string id = 1;
    // Namespace the caller is confined to; a goal outside it reads as not-found.
    // Empty or "*" means unrestricted.
    optional string namespace_scope = 2;
    reserved 3;  // was auth_token; deleted by ADR-021
}

message GetGoalResponse {
    bool found = 1;
    Goal goal = 2;
    string message = 3;
}

message ExpandRequest {
    string goal_id = 1;
    TraversalContext context = 2;
    // Namespace the caller is confined to; a goal outside it reads as not-found,
    // checked *before* any surface is built so a cross-namespace probe learns
    // nothing about another namespace's decomposition.
    optional string namespace_scope = 3;
    reserved 4;  // was auth_token; deleted by ADR-021
}

message ExpandResponse {
    // False when no such goal exists or it lies outside namespace_scope. This
    // distinguishes "no such goal" from "a real goal with no children", which
    // both yield an empty surface.
    bool found = 1;
    repeated ExpandedCandidate candidates = 2;      // role = accomplish, ranked
    repeated ExpandedCandidate decision_aids = 3;   // role = decide
    repeated FactorReading factor_readings = 4;
    string message = 5;
}

// ========== Health Check ==========

message HealthCheckRequest {
    // Empty for now
}

message HealthCheckResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_HEALTHY = 1;
        STATUS_DEGRADED = 2;
        STATUS_UNHEALTHY = 3;
    }
    
    Status status = 1;
    string version = 2;
    int64 uptime_seconds = 3;
    int64 claim_count = 4;
    string message = 5;
    // True when this instance is running under the development identity adapter
    // (design §7.2). Downstream layers surface this as an `X-Boswell-Auth:
    // dev-untrusted` marker so callers can see that what they are reading came
    // from fake identities and must not be trusted for long-term memory.
    bool dev_auth = 6;
}

// ========== Metrics ==========

// A counter carrying the tier it was recorded against.
message TierCount {
    Tier tier = 1;
    uint64 count = 2;
}

message GetMetricsRequest {
    // Empty for now
}

// Instance maintenance counters.
//
// Deliberately excludes any figure that would cost a full table scan to
// produce: a scrape runs every few seconds, and `HealthCheckResponse`'s
// `claim_count` materializes every claim to count it.
message GetMetricsResponse {
    // False when no Janitor is running in this process, in which case every
    // counter below is zero because nothing has swept, not because nothing
    // happened.
    bool janitor_enabled = 1;
    uint64 sweep_count = 2;
    // Counters recorded against the tier the claim was in at the time.
    repeated TierCount deleted = 3;
    repeated TierCount promoted = 4;
    repeated TierCount demoted = 5;
    int64 uptime_seconds = 6;
}
