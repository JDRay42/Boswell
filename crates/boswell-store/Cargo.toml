[package]
name = "boswell-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
boswell-domain = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# SQLite database
rusqlite = { version = "0.32", features = ["bundled"] }

# HNSW vector index for semantic search (ADR-005)
hnsw_rs = "0.3"

# ONNX Runtime for embeddings (to be integrated)
# ort = { version = "2.0", features = ["download-binaries"] }

# Serialization for embeddings
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Blocking HTTP client for local embedding models (Ollama).
# ureq is used instead of reqwest because EmbeddingModel::embed is a sync trait
# method invoked from inside async request handlers; ureq does blocking socket
# I/O without starting its own tokio runtime, so it is safe there.
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3.10"

# Benchmark harness. Default features pull in rayon and plotters for HTML
# reports; CI compiles every bench target on each run (`clippy --all-targets`),
# so only `cargo_bench_support` — the part that makes `cargo bench` work at all
# — is enabled.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "claim_store"
harness = false

[lints]
workspace = true
