[package]
name = "boswell-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "boswell-server"
path = "src/main.rs"

[dependencies]
boswell-domain = { workspace = true }
boswell-grpc = { workspace = true }
boswell-store = { workspace = true }
boswell-janitor = { workspace = true }
boswell-synthesizer = { workspace = true }
boswell-extractor = { workspace = true }
boswell-gatekeeper = { workspace = true }
boswell-llm = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
boswell-domain = { workspace = true }
tonic = "0.12"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
