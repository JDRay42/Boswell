[package]
name = "boswell-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
boswell-domain = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client for LLM providers
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
# `test-util` gives the retry tests a paused clock, so exercising the backoff
# path costs no wall-clock seconds. It is not in tokio's "full" feature set.
tokio = { version = "1.0", features = ["full", "test-util"] }

[lints]
workspace = true
