[workspace]
resolver = "2"
members = [
    "crates/boswell-domain",
    "crates/boswell-store",
    "crates/boswell-llm",
    "crates/boswell-grpc",
    "crates/boswell-router",
    "crates/boswell-sdk",
    "crates/boswell-extractor",
    "crates/boswell-gatekeeper",
    "crates/boswell-janitor",
    "crates/boswell-synthesizer",
    "crates/boswell-mcp",
    "crates/boswell-cli",
    "crates/boswell-server",
    "crates/boswell-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Boswell Contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/JDRay42/Boswell"

# Workspace-wide lints (applied to any crate with `[lints] workspace = true`).
[workspace.lints.clippy]
# gRPC returns `Result<_, tonic::Status>` throughout, and `Status` is large by
# design; `result_large_err` fires on tonic's generated code and our handlers
# alike. Boxing isn't possible (the trait signatures are fixed by tonic), so this
# lint is not actionable here.
result_large_err = "allow"

[workspace.dependencies]
# Internal crates
boswell-domain = { path = "crates/boswell-domain" }
boswell-store = { path = "crates/boswell-store" }
boswell-llm = { path = "crates/boswell-llm" }
boswell-grpc = { path = "crates/boswell-grpc" }
boswell-router = { path = "crates/boswell-router" }
boswell-sdk = { path = "crates/boswell-sdk" }
boswell-extractor = { path = "crates/boswell-extractor" }
boswell-gatekeeper = { path = "crates/boswell-gatekeeper" }
boswell-janitor = { path = "crates/boswell-janitor" }
boswell-synthesizer = { path = "crates/boswell-synthesizer" }
boswell-mcp = { path = "crates/boswell-mcp" }

# Common dependencies (version centralization)
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v7"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 1
